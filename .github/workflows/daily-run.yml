name: Daily signal run

on:
  schedule:
    - cron: "0 13 * * *" # 9am ET daily
  workflow_dispatch: # manual trigger from the Actions tab
    inputs:
      days:
        description: "News lookback in days (use more for a catch-up run)"
        default: "7"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun scripts/run.ts --days=${{ inputs.days || '7' }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Commit updated reports
        run: |
          git config user.name "signal-desk-bot"
          git config user.email "actions@github.com"
          git add data
          git diff --cached --quiet || git commit -m "chore: daily signal run"
          git push
